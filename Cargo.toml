[package]
description = "A stripped-down, black-and-white music library for video editors: folders, waveforms, drag-to-Premiere."
name = "disc-lite"
version = "2.5.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
drag = "2.1.1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "accesskit"] }
notify = "8.2.2"
raw-window-handle = "0.6.2"
rfd = "0.18.0"
rodio = "0.23.0"
rusty-leveldb = "4.0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.5.5", features = ["all"] }
trash = "5.3.0"
ureq = "3"
walkdir = "2.5.0"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Waveform decoding is the hot path even in debug builds.
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
